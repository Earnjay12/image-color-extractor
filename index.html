<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Chip — 이미지 색상 추출기</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <h1>Color Chip</h1>
  <p class="tagline">이미지에서 대표 색상을 뽑아 컬러칩으로 만들어 드립니다.</p>
</header>

<main>
  <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="이미지 업로드">
    <input type="file" id="fileInput" accept="image/*" hidden>
    <div class="dz-inner">
      <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2.5"></rect>
        <circle cx="8.5" cy="8.5" r="1.8"></circle>
        <path d="M21 15.5 16 10.5 5.5 21"></path>
      </svg>
      <p class="dz-title">이미지를 여기에 끌어다 놓으세요</p>
      <p class="dz-sub">클릭해서 선택하거나 <kbd>Ctrl</kbd> + <kbd>V</kbd> 로 붙여넣을 수도 있습니다</p>
    </div>
  </section>

  <section id="workspace" class="workspace" hidden>
    <div class="preview">
      <div class="preview-frame">
        <img id="previewImg" alt="업로드한 이미지 미리보기">
      </div>
      <div class="preview-meta">
        <span id="fileMeta" class="file-meta"></span>
        <button id="replaceBtn" class="btn ghost" type="button">이미지 교체</button>
      </div>
    </div>

    <div class="panel">
      <div class="control">
        <div class="control-head">
          <label for="countRange">컬러칩 개수</label>
          <output id="countOut" for="countRange">5</output>
        </div>
        <input type="range" id="countRange" min="2" max="12" value="5" step="1">
        <div class="ticks"><span>2</span><span>12</span></div>
      </div>

      <p id="status" class="status" hidden></p>

      <ul id="palette" class="palette"></ul>

      <p class="note">
        색상 코드를 클릭하면 클립보드에 복사됩니다.
        CMYK는 ICC 프로파일 없이 계산한 근사값이라 실제 인쇄 결과와는 차이가 있을 수 있습니다.
      </p>

      <button id="downloadBtn" class="btn primary" type="button">이미지 + 컬러칩 다운로드 (PNG)</button>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
